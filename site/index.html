<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<link rel="icon" href="brand/favicon.png" sizes="any">
<link rel="apple-touch-icon" href="brand/favicon.png">
<link rel="mask-icon" href="brand/avatar.svg" color="#ff7a45">
<link rel="stylesheet" href="assets/style.css?v={{V}}">
</head>
<body class="is-home">
<!-- 氛围层：远景 → 场景 → 压暗遮罩 → 跟随鼠标的暖光 → 上浮灯尘 → 右下角立绘。
     整层不吃鼠标事件，也不参与布局；JS 只在有精确指针的系统上启用多层视差与伪 3D 倾斜。
     首页用 home-night.webp（无人物、左侧留白），其余页沿用 scene-spring.webp。 -->
<div class="ambient" aria-hidden="true">
  <div class="amb-far"></div>
  <div class="amb-scene"></div>
  <div class="amb-veil"></div>
  <div class="amb-light"></div>
  <div class="amb-embers">
    <i style="--l:7%;--s:3px;--d:21s;--t:-3s;--w:18px;--o:.34"></i>
    <i style="--l:14%;--s:2px;--d:27s;--t:-14s;--w:-22px;--o:.26"></i>
    <i style="--l:23%;--s:4px;--d:18s;--t:-9s;--w:12px;--o:.30"></i>
    <i style="--l:31%;--s:2px;--d:24s;--t:-19s;--w:-14px;--o:.22"></i>
    <i style="--l:41%;--s:3px;--d:29s;--t:-5s;--w:26px;--o:.28"></i>
    <i style="--l:52%;--s:2px;--d:20s;--t:-12s;--w:-18px;--o:.24"></i>
    <i style="--l:61%;--s:4px;--d:26s;--t:-22s;--w:16px;--o:.32"></i>
    <i style="--l:69%;--s:2px;--d:17s;--t:-7s;--w:-24px;--o:.26"></i>
    <i style="--l:77%;--s:3px;--d:23s;--t:-16s;--w:20px;--o:.35"></i>
    <i style="--l:84%;--s:2px;--d:28s;--t:-2s;--w:-12px;--o:.24"></i>
    <i style="--l:91%;--s:4px;--d:19s;--t:-11s;--w:14px;--o:.30"></i>
    <i style="--l:96%;--s:2px;--d:25s;--t:-20s;--w:-20px;--o:.22"></i>
  </div>
  <div class="amb-char"><img src="brand/character-full.webp" alt="" decoding="async"></div>
</div>
<div class="glow" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<header class="top">
  <a class="brand" href="#/">
    <span class="brand-mark">火</span>
    <span class="brand-text">
      <strong>{{STREAMER}}</strong>
      <em>LIVE ARCHIVE</em>
    </span>
  </a>
  <nav class="nav" id="nav">
    <a href="#/" data-nav="home">首页</a>
    <a href="#/diary" data-nav="diary">日记</a>

    <a href="#/about" data-nav="about">关于</a>

<main id="app"></main>

<footer class="foot">
  <span class="foot-links">
    <a href="https://space.bilibili.com/2094031249" target="_blank" rel="noopener">主播 B 站主页</a>
    <a href="https://live.bilibili.com/22748536" target="_blank" rel="noopener">直播间</a>
  </span>
  <span>自动识别与翻译 · 未逐条校对</span>
  <span id="footMeta"></span>
</footer>

<!-- 背景音乐：贴在右侧边缘的固定浮层，折叠后只留 "<" 把手。
     音频不预加载，等真正播放（或首次点击页面）才向服务器取。 -->
<aside class="bgm" id="bgm" aria-label="背景音乐">
  <button class="bgm-tab" id="bgmFold" type="button" aria-controls="bgmPanel" aria-expanded="true" title="收起播放器">
    <span class="bgm-chev" aria-hidden="true">&gt;</span>
    <span class="bgm-note" aria-hidden="true">&#9834;</span>
  </button>
  <div class="bgm-panel" id="bgmPanel">
    <div class="bgm-head">
      <span class="bgm-disc" aria-hidden="true"></span>
      <span class="bgm-meta"><strong>また明日</strong><em>MATSU</em></span>
    </div>
    <div class="bgm-row">
      <button class="bgm-play" id="bgmPlay" type="button" aria-label="播放" aria-pressed="false"><span class="bgm-ico" aria-hidden="true"></span></button>
      <div class="bgm-seek">
        <input class="bgm-bar" id="bgmBar" type="range" min="0" max="1000" step="1" value="0" aria-label="播放进度">
        <span class="bgm-time"><span id="bgmNow">0:00</span> / <span id="bgmDur">--:--</span></span>
      </div>
    </div>
    <div class="bgm-foot">
      <button class="bgm-loop is-on" id="bgmLoop" type="button" aria-pressed="true" title="循环播放"><span aria-hidden="true">&#8635;</span> 循环</button>
      <span class="bgm-vol-label">音量</span>
      <input class="bgm-volume" id="bgmVol" type="range" min="0" max="100" step="1" value="40" aria-label="音量">
    </div>
  </div>
</aside>
<audio id="bgmAudio" src="audio/mata-ashita.mp3" loop preload="none"></audio>

<script src="assets/data.js?v={{V}}"></script>
<script src="assets/app.js?v={{V}}"></script>
</body>
</html>
