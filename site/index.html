<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<link rel="icon" href="brand/favicon.png" sizes="any">
<link rel="apple-touch-icon" href="brand/favicon.png">
<link rel="mask-icon" href="brand/avatar.svg" color="#ff7a45">
<link rel="stylesheet" href="assets/style.css">
</head>
<body class="is-home">
<!-- 氛围层：远景 → 场景 → 压暗遮罩 → 跟随鼠标的暖光 → 上浮灯尘。
     整层不吃鼠标事件，也不参与布局；JS 只在有精确指针的系统上启用多层视差与伪 3D 倾斜。
     首页用 home-night.webp（无人物、左侧留白），其余页沿用 scene-spring.webp。 -->
<div class="ambient" aria-hidden="true">
  <div class="amb-far"></div>
  <div class="amb-scene"></div>
  <div class="amb-veil"></div>
  <div class="amb-light"></div>
  <div class="amb-embers">
    <i style="--l:7%;--s:3px;--d:21s;--t:-3s;--w:18px;--o:.34"></i>
    <i style="--l:14%;--s:2px;--d:27s;--t:-14s;--w:-22px;--o:.26"></i>
    <i style="--l:23%;--s:4px;--d:18s;--t:-9s;--w:12px;--o:.30"></i>
    <i style="--l:31%;--s:2px;--d:24s;--t:-19s;--w:-14px;--o:.22"></i>
    <i style="--l:41%;--s:3px;--d:29s;--t:-5s;--w:26px;--o:.28"></i>
    <i style="--l:52%;--s:2px;--d:20s;--t:-12s;--w:-18px;--o:.24"></i>
    <i style="--l:61%;--s:4px;--d:26s;--t:-22s;--w:16px;--o:.32"></i>
    <i style="--l:69%;--s:2px;--d:17s;--t:-7s;--w:-24px;--o:.26"></i>
    <i style="--l:77%;--s:3px;--d:23s;--t:-16s;--w:20px;--o:.35"></i>
    <i style="--l:84%;--s:2px;--d:28s;--t:-2s;--w:-12px;--o:.24"></i>
    <i style="--l:91%;--s:4px;--d:19s;--t:-11s;--w:14px;--o:.30"></i>
    <i style="--l:96%;--s:2px;--d:25s;--t:-20s;--w:-20px;--o:.22"></i>
  </div>
</div>
<div class="glow" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<header class="top">
  <a class="brand" href="#/">
    <span class="brand-mark">火</span>
    <span class="brand-text">
      <strong>{{STREAMER}}</strong>
      <em>LIVE ARCHIVE</em>
    </span>
  </a>
  <nav class="nav" id="nav">
    <a href="#/" data-nav="home">首页</a>
    <a href="#/diary" data-nav="diary">日记</a>
    <a href="#/quotes" data-nav="quotes">摘录</a>
    <a href="#/archive" data-nav="archive">存档</a>
    <a href="#/about" data-nav="about">关于</a>
  </nav>
  <button class="nav-search" id="searchOpen" type="button" title="全站搜索 (Ctrl+K)" aria-label="打开全站搜索">
    <span class="ns-ico" aria-hidden="true">&#8983;</span>
    <span class="ns-text">搜索</span>
    <kbd>Ctrl K</kbd>
  </button>
</header>

<main id="app"></main>

<footer class="foot">
  <div class="foot-top">
    <div class="foot-id">
      <strong>{{STREAMER}} · 直播存档</strong>
      <span>非官方粉丝整理 · 中日对照的逐字稿、日记与摘录</span>
    </div>
    <div class="foot-links">
      <a href="https://github.com/hibane-hinome/live-archive" target="_blank" rel="noopener">GitHub 仓库</a>
      <a href="https://space.bilibili.com/2094031249" target="_blank" rel="noopener">主播主页</a>
      <a href="https://live.bilibili.com/22748536" target="_blank" rel="noopener">直播间</a>
    </div>
  </div>
  <div class="foot-bot">
    <span>内容著作权归主播及原权利人所有，如权利人要求删除，本站会配合处理。</span>
    <span>逐字稿与译文由自动识别、自动翻译生成；2026 年 11 月 16 日起的场次已逐条人工校对，更早场次尚未校对，引用前请回看原直播。</span>
    <span id="footMeta"></span>
  </div>
</footer>

<!-- 回到顶部：滚过一屏后出现在右下角（窄屏挪到左下角，避开底部悬浮的音乐面板） -->
<button class="totop" id="toTop" type="button" aria-label="回到顶部" title="回到顶部" aria-hidden="true" tabindex="-1">
  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    <path d="M12 19V5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</button>

<!-- 背景音乐：网易云外链播放器，贴在右侧边缘的固定浮层，折叠后只留 "<" 把手。 -->
<aside class="bgm" id="bgm" aria-label="背景音乐">
  <button class="bgm-tab" id="bgmFold" type="button" aria-controls="bgmPanel" aria-expanded="true" title="收起播放器">
    <span class="bgm-chev" aria-hidden="true">&gt;</span>
    <span class="bgm-note" aria-hidden="true">&#9834;</span>
  </button>
  <div class="bgm-panel" id="bgmPanel">
    <iframe class="bgm-frame" title="また明日 - MATSU" allow="autoplay" frameborder="no" border="0" marginwidth="0" marginheight="0" width="330" height="86" src="//music.163.com/outchain/player?type=2&id=2652366114&auto=1&height=66"></iframe>
  </div>
</aside>

<!-- 全站搜索：独立于 hash 路由的浮层，跨逐字稿 / 摘录 / 日记 / 场次检索 -->
<div class="sd-mask" id="searchMask" hidden></div>
<section class="sd" id="searchDlg" role="dialog" aria-modal="true" aria-label="全站搜索" hidden>
  <div class="sd-head">
    <span class="sd-ico" aria-hidden="true">&#8983;</span>
    <input id="searchInput" type="text" placeholder="搜索逐字稿、摘录、日记、场次…" autocomplete="off" spellcheck="false" aria-label="搜索关键词">
    <button class="sd-esc" id="searchClose" type="button" aria-label="关闭搜索">Esc</button>
  </div>
  <div class="sd-hint">跨逐字稿 / 摘录 / 日记 / 场次检索 · ↑↓ 选择 · 回车打开 · Esc 关闭</div>
  <div class="sd-body" id="searchResults"></div>
  <div class="sd-foot">
    <span id="searchCount">输入关键词开始检索</span>
    <span id="searchScope"></span>
  </div>
</section>

<!-- data.js 由 tools/gen_data.py 产出，经 Vite 的 publicDir 原样发布 -->
<script src="/assets/data.js"></script>
<script type="module" src="assets/app.js"></script>
</body>
</html>
