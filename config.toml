# 数据源：指向本机 LiveCaptions-Translator 的数据库。换机器只改这一行。
[source]
db = "D:/HibaneHinome/live-archive/.data/translation_history.db"
session_gap_min = 30   # 相邻记录超过这个间隔就算新的一场
min_records = 20       # 少于这个条数的片段当作误录，不进站点
quiet_min = 10         # 最后一条记录静默超过这个分钟数，才认为直播已结束

[site]
dir = "site"           # 前端源码 + 数据
dist = "dist"          # 构建产物（不入库，由 CI 生成）

[publish]
remote = "origin"
branch = "main"
auto_push = false      # false = review 模式：自动任务只做导出/构建/本地提交，
                       # 人工确认内容后执行 publish.cmd --push 才会上 GitHub
